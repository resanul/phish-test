<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoom Video Communications — Security Verification</title>
  <style>
    body { margin:0; padding:20px; background:#f7f9fa; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#232333; display:flex; align-items:center; justify-content:center; min-height:100vh; box-sizing:border-box; }
    .card { background:#fff; width:100%; max-width:440px; border-radius:12px; border:1px solid #e5e9eb; box-shadow:0 8px 24px rgba(45,140,255,0.08); padding:36px; box-sizing:border-box; }
    .logo { color:#2d8cff; font-size:32px; font-weight:800; letter-spacing:-1px; margin-bottom:12px; }
    .sim-banner { background:#ebf5ff; border:1px solid #bae0ff; color:#0050b3; font-size:11px; padding:7px 10px; border-radius:6px; margin-bottom:18px; font-weight:600; text-align:center; }
    h1 { font-size:22px; font-weight:700; margin:0 0 8px 0; color:#232333; }
    p { font-size:13px; color:#747487; line-height:1.5; margin:0 0 24px 0; }
    .field { margin-bottom:16px; }
    label { display:block; font-size:12px; font-weight:600; color:#4a4a5a; margin-bottom:6px; }
    input { width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid #d0d7de; border-radius:8px; font-size:14px; }
    input:focus { outline:none; border-color:#2d8cff; box-shadow:0 0 0 3px rgba(45,140,255,0.15); }
    button { width:100%; background:#2d8cff; color:#fff; border:none; padding:12px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; }
    button:hover { background:#0e70eb; }
    .footer { font-size:11px; color:#9999a8; text-align:center; margin-top:18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">zoom</div>
    <div class="sim-banner">🔒 Authorised Security Awareness Simulation</div>
    <h1>Meeting Security Verification</h1>
    <p>Identity verification is required to access your scheduled Zoom executive meeting room.</p>
    <form method="post" action="/submit">
      <input type="hidden" name="template" value="8.html">
      <div class="field">
        <label>Participant Full Name</label>
        <input type="text" name="name" placeholder="Your Full Name" required>
      </div>
      <div class="field">
        <label>Corporate Email</label>
        <input type="email" name="email" placeholder="name@company.com" required>
      </div>
      <div class="field">
        <label>Meeting ID / Passcode Reference</label>
        <input type="text" name="employee_id" placeholder="849 2049 1920" required>
      </div>
      <button type="submit">Verify &amp; Join Meeting</button>
    </form>
    <div class="footer">Zoom Video Communications, Inc. · Security Drill</div>
  </div>
</body>
</html>
